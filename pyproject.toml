[project]
name = "hpsilab-mcp"
version = "0.13.3"
description = "Python SDK for the HPSILab quantitative finance API — options analytics, IV surface modeling, Monte Carlo simulation, and AI-driven predictions, with native MCP support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Haiyun Hu" }
]

keywords = [
    "quantitative-finance",
    "quant-finance",
    "options",
    "options-analytics",
    "mcp",
    "model-context-protocol",
    "implied-volatility",
    "monte-carlo",
    "black-scholes",
    "trading",
    "stock-analytics",
    "sdk",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
# Pay-per-call. Only needed to answer an HTTP 402 challenge automatically —
# every free-quota call works without it. See hpsilab_mcp/payments.py.
# x402[evm], not bare x402: the EVM signer module imports web3 at import
# time, and bare x402 does not depend on it. Installing the two separately
# produces a working-looking install that raises ImportError the moment a
# wallet is constructed (0.6.0 shipped exactly that).
x402 = [
  "x402[evm]>=2.14,<3",
  "eth-account>=0.13,<1",
]

[project.urls]
Homepage = "https://hpsilab.com"
Repository = "https://github.com/haiyunsky/hpsilab-mcp-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.gitignore",
  "/.agents",
  "/CHANGELOG.md",
  "/tests",
  "/docs",
  "/examples",
  "/python",
  "/typescript",
]

# `/.gitignore` above is honoured by the wheel and **cannot** be honoured by
# the sdist: hatchling force-includes every VCS exclusion file into the sdist
# so the archive can reproduce its own file selection
# (hatchling/builders/sdist.py, `force_include[exclusion_file]`). No exclude,
# and not even `only-include`, removes it — verified against hatchling 1.31.0.
#
# So the sdist ships a 257-byte list of cache directories, and the wheel — the
# artifact `pip install` actually uses — ships the package and nothing else.
# Recorded here because 0.12.2's changelog claimed the file was excluded, and
# the next person to read that and see the file will otherwise go looking for
# a config mistake that does not exist.
